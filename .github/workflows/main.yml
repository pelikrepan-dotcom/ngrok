# .github/workflows/main.yml
name: Windows - Ngrok

on: workflow_dispatch

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_KEY }}
  RDP_USER: admin
  RDP_PASS: ${{ secrets.RDP_PASS }}

jobs:
  ngrok-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Setup Windows Remote Desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # bypass local password complexity policy so RDP_PASS always works
          secedit /export /cfg C:\secpol.cfg | Out-Null
          (Get-Content C:\secpol.cfg) -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' |
            Set-Content C:\secpol.cfg
          (Get-Content C:\secpol.cfg) -replace 'MinimumPasswordLength = \d+', 'MinimumPasswordLength = 0' |
            Set-Content C:\secpol.cfg
          secedit /configure /db C:\Windows\security\local.sdb /cfg C:\secpol.cfg /areas SECURITYPOLICY | Out-Null
          Remove-Item C:\secpol.cfg -ErrorAction SilentlyContinue

          if ([string]::IsNullOrEmpty($env:RDP_PASS)) {
            throw "RDP_PASS secret is empty. Set it in repo Settings > Secrets and variables > Actions."
          }

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

          $securePass = ConvertTo-SecureString $env:RDP_PASS -AsPlainText -Force

          if ("$env:RDP_USER" -eq "runneradmin") {
            Write-Host "Warning: Using default user account!"
            Set-LocalUser -Name $env:RDP_USER -Password $securePass
          } else {
            if (Get-LocalUser -Name $env:RDP_USER -ErrorAction SilentlyContinue) {
              Set-LocalUser -Name $env:RDP_USER -Password $securePass
            } else {
              New-LocalUser -Name $env:RDP_USER -Password $securePass | Out-Null
            }
            Add-LocalGroupMember -Group "Administrators" -Member $env:RDP_USER -ErrorAction SilentlyContinue
            Enable-LocalUser -Name $env:RDP_USER
          }

          icacls "C:\Windows\Temp" /grant "$env:RDP_USER`:F" *>$null
          icacls "C:\Windows\installer" /grant "$env:RDP_USER`:F" *>$null

          Set-Service -Name "W32Time" -StartupType Automatic -ErrorAction SilentlyContinue
          Restart-Service W32Time -ErrorAction SilentlyContinue
          w32tm /resync /force *>$null
          w32tm /config /manualpeerlist:"time.windows.com" /syncfromflags:manual /reliable:yes /update *>$null

          diskperf -Y *>$null

          $ErrorActionPreference = 'SilentlyContinue'
          foreach ($p in @("$env:TEMP\*", "C:\Windows\Temp\*", "C:\Windows\Prefetch\*", "C:\Users\Public\Desktop\*")) {
            Remove-Item -Path $p -Recurse -Force -ErrorAction SilentlyContinue
          }
          try {
            (New-Object -ComObject Shell.Application).Namespace(0xA).Items() | ForEach-Object {
              Remove-Item $_.Path -Recurse -Force -Confirm:$false -ErrorAction SilentlyContinue
            }
            (New-Object -ComObject Shell.Application).MinimizeAll()
          } catch {}
          exit 0

      - name: Install and Configure Ngrok
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrEmpty($env:NGROK_AUTH_TOKEN)) {
            throw "NGROK_AUTH_KEY secret is empty. Set it in repo Settings > Secrets and variables > Actions."
          }
          Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
          Expand-Archive ngrok.zip -DestinationPath .\ngrok
          .\ngrok\ngrok.exe authtoken $env:NGROK_AUTH_TOKEN

      - name: Start Ngrok Tunnel
        shell: pwsh
        run: |
          $maxRetries = 3
          $retryCount = 0
          $success = $false

          while (-not $success -and $retryCount -lt $maxRetries) {
            Remove-Item ".\ngrok.log", ".\ngrok.err" -ErrorAction SilentlyContinue
            Start-Process -FilePath ".\ngrok\ngrok.exe" `
              -ArgumentList "tcp 3389 --log=stdout --log-format=logfmt" `
              -WindowStyle Hidden -RedirectStandardOutput ".\ngrok.log" -RedirectStandardError ".\ngrok.err"

            $attempts = 0
            $maxAttempts = 10
            $ngrokUrl = $null

            while (-not $ngrokUrl -and $attempts -lt $maxAttempts) {
              Start-Sleep -Seconds 5
              $attempts++
              try {
                $tunnels = Invoke-RestMethod -Uri http://localhost:4040/api/tunnels
                $ngrokUrl = ($tunnels.tunnels | Where-Object { $_.proto -eq 'tcp' }).public_url
              } catch {
                Write-Host "Attempt $attempts`: Waiting for Ngrok to start..."
              }
            }

            if (-not $ngrokUrl) {
              Write-Host "Failed to retrieve Ngrok URL after $maxAttempts attempts."
              Write-Host "--- ngrok.log ---"
              Get-Content ".\ngrok.log" -ErrorAction SilentlyContinue
              Write-Host "--- ngrok.err ---"
              Get-Content ".\ngrok.err" -ErrorAction SilentlyContinue
              Get-Process ngrok -ErrorAction SilentlyContinue | Stop-Process -Force
              $retryCount++
              continue
            }

            $ngrokUrl = $ngrokUrl -replace "^tcp://", ""
            $address, $port = $ngrokUrl -split ":"

            $testResult = Test-NetConnection -ComputerName $address -Port $port
            if ($testResult.TcpTestSucceeded) {
              $success = $true
              $remoteAddress = $testResult.RemoteAddress.IPAddressToString
              Write-Host "RDP Connection Details"
              Write-Host "URL: $remoteAddress`:$port"
              Write-Host "Username: $env:RDP_USER"
              Write-Host "Password: $env:RDP_PASS"
            } else {
              Write-Host "Connection test failed. Retrying..."
              Get-Process ngrok -ErrorAction SilentlyContinue | Stop-Process -Force
              $retryCount++
              Start-Sleep -Seconds 5
            }
          }

          if (-not $success) {
            Write-Host "--- final ngrok.log ---"
            Get-Content ".\ngrok.log" -ErrorAction SilentlyContinue
            Write-Host "--- final ngrok.err ---"
            Get-Content ".\ngrok.err" -ErrorAction SilentlyContinue
            throw "Failed to establish a working Ngrok tunnel after $maxRetries attempts."
          }

      - name: Keep Alive
        shell: pwsh
        run: |
          $duration = 21600
          $interval = 300
          $endTime = (Get-Date).AddSeconds($duration)
          while ((Get-Date) -lt $endTime) {
            $ngrokProcess = Get-Process -Name "ngrok" -ErrorAction SilentlyContinue
            if (-not $ngrokProcess) {
              Write-Host "Ngrok process not found. Exiting workflow."
              exit 1
            }
            Start-Sleep -Seconds $interval
          }

      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          $ngrokProcess = Get-Process -Name "ngrok" -ErrorAction SilentlyContinue
          if ($ngrokProcess) {
            Write-Host "Terminating Ngrok process..."
            $ngrokProcess | Stop-Process -Force
          }
          Write-Host "Cleanup complete."
